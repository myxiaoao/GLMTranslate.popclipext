name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build extension
        run: |
          mkdir -p target/GLM_Translate.popclipext
          cp Config.json target/GLM_Translate.popclipext/
          cp translate.js target/GLM_Translate.popclipext/

      - name: Create zip package
        run: |
          cd target
          zip -r GLM_Translate.popclipextz GLM_Translate.popclipext

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          files: target/GLM_Translate.popclipextz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
